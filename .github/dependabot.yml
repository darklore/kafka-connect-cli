version: 2
updates:
  - directory: /
    package-ecosystem: "gomod"
    schedule:
      day: "sunday"
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      major:
        patterns:
          - "*"
        update-types:
          - major
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
